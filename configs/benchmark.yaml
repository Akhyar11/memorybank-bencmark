# benchmark.yaml – Full benchmark configuration
# All hyperparameters explicit – no hardcoded values in code

# Model
vocab_size: 2000
embed_dim: 128
num_layers: 2
num_heads: 4
ff_dim: 256
max_input_len: 32
max_target_len: 16
dropout_rate: 0.1

# Memory Bank (locked components)
memory_capacity: 128
memory_dim: 32
hidden_size: 32
memory_top_k: 8
memory_threshold: 0.0
memory_read_threshold: 0.0
memory_write_threshold: 0.0

# Decay parameters
mem_decay_rate: 0.001
mem_importance_protection: 0.5

# Score weights
mem_alpha: 1.0
mem_beta: 0.5
mem_gamma: 0.1
mem_delta: 0.2
mem_reinforcement_rate: 0.05

# Training
batch_size: 32
num_epochs: 50
learning_rate_peak: 0.002
learning_rate_init: 0.0001
learning_rate_end: 0.00001
warmup_steps: 100
weight_decay: 0.0001
grad_clip: 1.0
seed: 42

# Dataset
max_samples: null  # null = all samples
split_strategy: entity_aware_80_10_10

# Evaluation
eval_seeds: [0, 1, 2]
memory_mode: episodic  # episodic or persistent

# Experiment matrix
experiments:
  - memory_functional_benchmark
  - no_memory_baseline
  - memory_bank_qa
  - nearest_neighbor_baseline
  - capacity_scaling
  - distractor_scaling
  - forgetting
  - replacement
  - counterfactual
  - ablation
